name: Build app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the coaching engine
        working-directory: core
        run: ../gradlew test

      - name: Build the app
        run: ./gradlew :app:assembleRelease

      - name: Name the install file
        run: cp app/build/outputs/apk/release/app-release.apk RepCoach.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RepCoach
          path: RepCoach.apk

      # Each build on main becomes a release, so the latest install file is always at
      # https://github.com/Dred101/strength-coach/releases/latest
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" RepCoach.apk \
            --title "Rep Coach 0.1.${{ github.run_number }}" \
            --notes "Built from ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)" \
            --latest
